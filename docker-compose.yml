services:
  agentlens:
    image: ghcr.io/agentkitai/agentlens:latest
    # build:
    #   context: ../agentlens
    #   dockerfile: Dockerfile
    container_name: agentlens
    # Profiles (#6): minimal = observability + memory; governance adds the
    # approval gateway. `full` is kept as an alias of governance. Select with
    # COMPOSE_PROFILES (.env) or `docker compose --profile <name> up`.
    profiles: ["minimal", "governance", "full"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AUTH_DISABLED=true
      - DB_PATH=/app/data/agentlens.db
      # JWT_SECRET is REQUIRED by current AgentLens (fatal at boot if unset,
      # even with AUTH_DISABLED). Reuses the stack's shared dev secret.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (copy from .env.example)}
      - AGENTGATE_URL=http://agentgate:3002
      - LORE_ENABLED=true
      - LORE_MODE=remote
      - LORE_API_URL=http://lore:8765
      - LORE_API_KEY=${LORE_API_KEY:?set LORE_API_KEY in .env (copy from .env.example)}
    volumes:
      - agentlens-data:/app/data
    networks:
      - agentkit
    restart: unless-stopped
    # The image's built-in HEALTHCHECK probes port 3400 (its default PORT), but
    # we run it on 3000 — so override it to probe the real port. (node base image,
    # no curl/wget.)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Hard-depend only on lore (present in every profile); agentgate is reached
    # via its runtime URL (best-effort), so the minimal profile doesn't have to
    # pull it in. It still comes up first in governance.
    depends_on:
      lore:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  agentgate:
    image: ghcr.io/agentkitai/agentgate:latest
    # build:
    #   context: ../agentgate
    #   dockerfile: Dockerfile
    container_name: agentgate
    profiles: ["governance", "full"]  # the approval gateway — not in minimal
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - LOG_FORMAT=json
      - ADMIN_API_KEY=${ADMIN_API_KEY:?set ADMIN_API_KEY in .env (copy from .env.example)}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (copy from .env.example)}
      - AGENTLENS_URL=http://agentlens:3000
    volumes:
      - agentgate-data:/app/data
    networks:
      - agentkit
    restart: unless-stopped
    healthcheck:
      # node-based probe: the agentgate image (node:22-alpine) has no curl
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  lore:
    image: ghcr.io/agentkitai/lore:latest
    # build:
    #   context: ../lore
    #   dockerfile: Dockerfile.server
    container_name: lore
    profiles: ["minimal", "governance", "full"]  # memory — in every profile
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql://lore:lore@lore-db:5432/lore
    volumes:
      - lore-data:/app/data
    networks:
      - agentkit
    restart: unless-stopped
    depends_on:
      lore-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  lore-db:
    image: pgvector/pgvector:pg16
    container_name: lore-db
    profiles: ["minimal", "governance", "full"]  # lore's datastore
    environment:
      - POSTGRES_USER=lore
      - POSTGRES_PASSWORD=lore
      - POSTGRES_DB=lore
    volumes:
      - lore-db-data:/var/lib/postgresql/data
    networks:
      - agentkit
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  agentlens-data:
  agentgate-data:
  lore-data:
  lore-db-data:

networks:
  agentkit:
    driver: bridge
