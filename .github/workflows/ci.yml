name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Bring the stack up (wait for healthchecks)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Poll documented health endpoints
        run: |
          set -e
          curl -fsS http://localhost:3000/api/health/overview > /dev/null
          curl -fsS http://localhost:3002/health             > /dev/null
          curl -fsS http://localhost:8765/health             > /dev/null
          curl -fsS http://localhost:8766/health             > /dev/null
          echo "All four services healthy."

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
